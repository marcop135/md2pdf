name: Bug report
description: Report a defect in the app or its build.
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact actions, starting from the live app or a local `npm start`.
      placeholder: |
        1. Open https://md2pdf.marcopontili.com
        2. Paste the markdown below into the editor
        3. Click Export to .pdf
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown that triggers it
      description: The smallest input that reproduces the problem. Leave blank if the bug is not input-specific.
      render: markdown
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any console errors.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it happens
      options:
        - Editor
        - Live preview
        - Mermaid diagram
        - PDF export / print dialog
        - File import (.md)
        - Offline / installed PWA
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 130, Safari 18
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and device
      placeholder: e.g. Windows 11, macOS 15.1, Android 15 (Pixel 8)
    validations:
      required: true
