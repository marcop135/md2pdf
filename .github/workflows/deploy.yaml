name: Deploy to production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # `npm install`, not `npm ci`: the committed package-lock.json is
        # generated on Windows and only records the host platform's optional
        # native binaries (rolldown bindings). `npm ci` would skip the
        # linux-x64-gnu binding the runner needs (npm/cli#4828), breaking
        # vite/rolldown at test time. `npm install` fetches the right binary
        # for this platform.
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Sync dist via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          # FTP_HOST must match the CN/SAN on the FTPS server's TLS cert
          # (typically the bare shared-hosting hostname), not a vanity FQDN
          # like ftp.example.com. With `security: strict`, hostname mismatch
          # aborts the deploy.
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME_PRODUCTION }}
          password: ${{ secrets.FTP_PASSWORD_PRODUCTION }}
          server-dir: ./
          local-dir: ./dist/
          protocol: ftps
          port: 21
          security: strict
          dangerous-clean-slate: false
