name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # The committed package-lock.json is generated on Windows and only
        # records the host platform's optional native binaries (rolldown
        # bindings). Both `npm ci` and `npm install` honor that lockfile and
        # skip the linux-x64-gnu binding this Ubuntu runner needs, breaking
        # vite/rolldown at test time (npm/cli#4828). Removing the lockfile lets
        # npm resolve the correct binary for the runner platform. The lockfile
        # stays committed for local dev and Dependabot.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Prefer SFTP: a single SSH channel avoids the FTPS control-socket
      # timeouts Netsons hits on first connect, and it sidesteps TLS hostname
      # verification entirely. `mirror -R --delete` reproduces the FTPS action's
      # sync-and-prune. If SFTP cannot connect, the FTPS fallback below runs.
      # Mirrors the transport strategy proven in the marcopontili.com repo.
      - name: Deploy via SFTP
        id: sftp
        continue-on-error: true
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.FTP_USERNAME_PRODUCTION }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD_PRODUCTION }}
        run: |
          lftp -u "$SFTP_USER" --env-password \
            -e "set cmd:fail-exit yes; set sftp:auto-confirm yes; set net:max-retries 5; set net:timeout 60; mirror -R --delete --verbose --exclude '^\.well-known/' --exclude '\.ftp-deploy-sync-state\.json\$' dist/ /; bye" \
            "sftp://$SFTP_HOST:$SFTP_PORT"

      # Fallback to FTPS only when SFTP failed. `security` is deliberately left
      # at the action's default (loose): the shared-hosting server presents a
      # certificate for its own Netsons hostname, which never covers a vanity
      # FTP_HOST, so `strict` aborts the transfer with
      # ERR_TLS_CERT_ALTNAME_INVALID. The channel is still TLS-encrypted.
      - name: Sync dist via FTPS (fallback)
        id: ftps
        if: steps.sftp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME_PRODUCTION }}
          password: ${{ secrets.FTP_PASSWORD_PRODUCTION }}
          server-dir: ./
          local-dir: ./dist/
          protocol: ftps
          port: 21
          dangerous-clean-slate: false
          timeout: 60000

      - name: Sync dist via FTPS (fallback retry)
        id: ftps-retry
        if: steps.sftp.outcome == 'failure' && steps.ftps.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME_PRODUCTION }}
          password: ${{ secrets.FTP_PASSWORD_PRODUCTION }}
          server-dir: ./
          local-dir: ./dist/
          protocol: ftps
          port: 21
          dangerous-clean-slate: false
          timeout: 60000

      # Every transport step is continue-on-error, so the job result comes from
      # here: green only when one of them actually uploaded.
      - name: Verify deploy succeeded
        if: always()
        run: |
          if [ "${{ steps.sftp.outcome }}" = "success" ]; then
            echo "Deploy succeeded via SFTP."
            exit 0
          fi
          if [ "${{ steps.ftps.outcome }}" = "success" ]; then
            echo "Deploy succeeded via FTPS fallback."
            exit 0
          fi
          if [ "${{ steps.ftps-retry.outcome }}" = "success" ]; then
            echo "Deploy succeeded via FTPS retry."
            exit 0
          fi
          echo "All deploy methods failed."
          exit 1
