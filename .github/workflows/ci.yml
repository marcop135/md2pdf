name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint changelog
        run: npm run changelog:lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify agent discovery files
        run: npm run verify:agent-readiness

      - name: Check title and description lengths
        run: npm run meta:lint

      # Offline: internal links only. Root-relative links resolve against
      # dist/, and /privacy falls back to privacy.html like the server rewrite.
      - name: Check internal links in dist
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --root-dir ${{ github.workspace }}/dist --fallback-extensions html --no-progress './dist/**/*.html'
          fail: true
