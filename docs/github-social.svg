<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Free Markdown to PDF editor — offline and mobile-friendly</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g opacity="0.08" fill="#ffffff">
    <circle cx="60" cy="80" r="3"/>
    <circle cx="120" cy="60" r="2"/>
    <circle cx="180" cy="100" r="2.5"/>
    <circle cx="1160" cy="550" r="3"/>
    <circle cx="1220" cy="510" r="2"/>
    <circle cx="1100" cy="570" r="2.5"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="175" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1">
      Markdown to PDF
    </text>
    <text x="80" y="227" font-size="34" font-weight="500" fill="#dbeafe" letter-spacing="-0.3">
      Write. Preview. Export PDF.
    </text>
    <text x="80" y="260" font-size="22" font-weight="500" fill="#c5d9f7" letter-spacing="-0.1">
      Works offline · Mobile-friendly
    </text>

    <g transform="translate(80, 300)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="12" r="5" fill="#ffffff"/>
        <text x="36" y="22" font-size="30" font-weight="500" fill="#ffffff">GFM + syntax-highlighted code</text>
      </g>
      <g transform="translate(0, 58)">
        <circle cx="10" cy="12" r="5" fill="#ffffff"/>
        <text x="36" y="22" font-size="30" font-weight="500" fill="#ffffff">Mermaid diagrams + live preview</text>
      </g>
      <g transform="translate(0, 116)">
        <circle cx="10" cy="12" r="5" fill="#ffffff"/>
        <text x="36" y="22" font-size="30" font-weight="500" fill="#ffffff">Print to PDF — nothing uploaded</text>
      </g>
    </g>
  </g>

  <g filter="url(#shadow)" transform="translate(820, 130)">
    <rect width="380" height="380" rx="28" fill="url(#card)"/>

    <g transform="translate(45, 40)">
      <rect width="202" height="246" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
      <path d="M 168 0 L 202 34 L 168 34 Z" fill="#e9ecef"/>
      <line x1="22" y1="45" x2="157" y2="45" stroke="#0d6efd" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="67" x2="180" y2="67" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="87" x2="135" y2="87" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="108" x2="168" y2="108" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <rect x="22" y="130" width="157" height="40" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
      <line x1="34" y1="143" x2="112" y2="143" stroke="#0d6efd" stroke-width="2"/>
      <line x1="34" y1="158" x2="90" y2="158" stroke="#6c757d" stroke-width="2"/>
      <line x1="22" y1="191" x2="180" y2="191" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="211" x2="146" y2="211" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(269, 145)" stroke="#0d6efd" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 0 L 34 0"/>
      <path d="M 25 -9 L 34 0 L 25 9"/>
    </g>

    <g transform="translate(314, 90)">
      <rect width="46" height="58" rx="5" fill="#dc3545"/>
      <text x="23" y="40" font-size="16" font-weight="800" fill="#ffffff" font-family="system-ui, sans-serif" text-anchor="middle">PDF</text>
    </g>
  </g>
</svg>
