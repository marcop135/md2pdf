<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Markdown to PDF: Markdown converts to PDF in the browser">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="33%" stop-color="#3B82F6"/>
      <stop offset="66%" stop-color="#0D6EFD"/>
      <stop offset="100%" stop-color="#0A58CA"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="text-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Same composition as og-img.svg (1200x630), centered on 1280x640. -->
  <g transform="translate(40 5)">
    <text x="600" y="172" text-anchor="middle" fill="#ffffff"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="78" font-weight="800" letter-spacing="-1.6" filter="url(#text-soft)">Markdown to PDF</text>

    <!-- Markdown mark -->
    <g transform="translate(300 360) translate(-104 -64)" filter="url(#soft)">
      <rect x="5" y="5" width="198" height="118" rx="12" fill="none" stroke="#ffffff" stroke-width="10"/>
      <path fill="#ffffff" d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z"/>
    </g>

    <!-- md2pdf app mark (favicon artwork, inverted for the blue ground) -->
    <g transform="translate(600 360) scale(2.4) translate(-32 -32)" filter="url(#soft)">
      <rect width="64" height="64" rx="14" fill="#ffffff"/>
      <path d="M18 12h22l8 8v32H18z" fill="#0d6efd"/>
      <path d="M40 12v8h8" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M33 28v14m-7-6 7 7 7-7" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- PDF document -->
    <g transform="translate(900 360) translate(-60 -84)" filter="url(#soft)">
      <path d="M0 0h88l40 40v128H0z" fill="#ffffff"/>
      <path d="M88 0v40h40" fill="#cfe2ff"/>
      <g stroke="#adb5bd" stroke-width="6" stroke-linecap="round">
        <path d="M20 30h50"/>
        <path d="M20 54h88"/>
        <path d="M20 78h88"/>
      </g>
      <rect x="-22" y="100" width="118" height="50" rx="9" fill="#dc3545"/>
      <text x="37" y="136" text-anchor="middle" fill="#ffffff"
            font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            font-size="32" font-weight="800" letter-spacing="1">PDF</text>
    </g>

    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#text-soft)">
      <path d="M428 360h44m-16-16 16 16-16 16"/>
      <path d="M728 360h44m-16-16 16 16-16 16"/>
    </g>

    <text x="600" y="540" text-anchor="middle" fill="#ffffff"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="32" font-weight="700" letter-spacing="0.4" filter="url(#text-soft)">md2pdf</text>
  </g>
</svg>
