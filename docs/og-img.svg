<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Markdown to PDF — offline browser converter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.08" fill="#ffffff">
    <circle cx="60" cy="80" r="3"/>
    <circle cx="120" cy="60" r="2"/>
    <circle cx="180" cy="100" r="2.5"/>
    <circle cx="1080" cy="540" r="3"/>
    <circle cx="1140" cy="500" r="2"/>
    <circle cx="1020" cy="560" r="2.5"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="200" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Markdown to PDF
    </text>
    <text x="80" y="252" font-size="28" font-weight="500" fill="#dbeafe" letter-spacing="-0.3">
      Offline. Private. In your browser.
    </text>

    <g transform="translate(80, 320)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="4" fill="#ffffff"/>
        <text x="32" y="18" font-size="26" font-weight="500" fill="#ffffff">GFM + syntax-highlighted code</text>
      </g>
      <g transform="translate(0, 50)">
        <circle cx="10" cy="10" r="4" fill="#ffffff"/>
        <text x="32" y="18" font-size="26" font-weight="500" fill="#ffffff">Mermaid diagrams + live preview</text>
      </g>
      <g transform="translate(0, 100)">
        <circle cx="10" cy="10" r="4" fill="#ffffff"/>
        <text x="32" y="18" font-size="26" font-weight="500" fill="#ffffff">Print to PDF — nothing uploaded</text>
      </g>
    </g>

    <g transform="translate(80, 530)">
      <rect x="0" y="0" width="280" height="64" rx="32" fill="#ffffff"/>
      <text x="140" y="42" font-size="24" font-weight="700" fill="#0d6efd" text-anchor="middle">
        Try it now &#8594;
      </text>
    </g>
    <text x="380" y="572" font-size="20" font-weight="500" fill="#dbeafe">
      md2pdf.marcopontili.com
    </text>
  </g>

  <g filter="url(#shadow)" transform="translate(770, 150)">
    <rect width="340" height="340" rx="24" fill="url(#card)"/>

    <g transform="translate(40, 36)">
      <rect width="180" height="220" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
      <path d="M 150 0 L 180 30 L 150 30 Z" fill="#e9ecef"/>
      <line x1="20" y1="40" x2="140" y2="40" stroke="#0d6efd" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="60" x2="160" y2="60" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <line x1="20" y1="78" x2="120" y2="78" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <line x1="20" y1="96" x2="150" y2="96" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <rect x="20" y="116" width="140" height="36" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
      <line x1="30" y1="128" x2="100" y2="128" stroke="#0d6efd" stroke-width="2"/>
      <line x1="30" y1="140" x2="80" y2="140" stroke="#6c757d" stroke-width="2"/>
      <line x1="20" y1="170" x2="160" y2="170" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
      <line x1="20" y1="188" x2="130" y2="188" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(240, 130)" stroke="#0d6efd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 0 L 30 0"/>
      <path d="M 22 -8 L 30 0 L 22 8"/>
    </g>

    <g transform="translate(280, 80)">
      <rect width="40" height="50" rx="4" fill="#dc3545"/>
      <text x="20" y="34" font-size="14" font-weight="800" fill="#ffffff" font-family="system-ui, sans-serif" text-anchor="middle">PDF</text>
    </g>
  </g>
</svg>
